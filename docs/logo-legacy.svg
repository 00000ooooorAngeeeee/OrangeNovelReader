<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 橘子果肉渐变 -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    
    <!-- 圆角矩形裁剪路径 -->
    <clipPath id="rectClip">
      <rect x="80" y="80" width="340" height="340" rx="60" ry="60"/>
    </clipPath>
  </defs>

  <!-- 外框（白色圆角矩形，带淡灰色边框） -->
  <rect x="80" y="80" width="340" height="340" rx="60" ry="60" fill="#ffffff" stroke="#E0E0E0" stroke-width="3"/>
  
  <!-- 绿色书签 -->
  <path d="M 320 80 L 380 80 L 380 180 L 350 150 L 320 180 Z" fill="#4CAF50"/>

  <!-- 橘子主体（利用裁剪路径完美贴合底部圆角） -->
  <g clip-path="url(#rectClip)">
    <!-- 半圆形橘子主体 -->
    <path d="M 80 250 A 170 170 0 0 1 420 250 L 420 420 L 80 420 Z" fill="url(#orangeGradient)"/>
  </g>

  <!-- 顶部绿叶 -->
  <path d="M 250 250 Q 210 200 180 220 Q 210 245 250 250 Z" fill="#4CAF50"/>
  <path d="M 250 250 Q 290 200 320 220 Q 290 245 250 250 Z" fill="#4CAF50"/>

  <!-- 橘子瓣/果肉（白色点缀，呈放射状分布） -->
  <!-- 中心 -->
  <path d="M 250 300 C 265 315 265 345 250 360 C 235 345 235 315 250 300 Z" fill="#ffffff"/>
  
  <!-- 左内 -->
  <path d="M 200 330 C 225 340 225 370 210 385 C 190 370 185 345 200 330 Z" fill="#ffffff"/>
  
  <!-- 右内 -->
  <path d="M 300 330 C 275 340 275 370 290 385 C 310 370 315 345 300 330 Z" fill="#ffffff"/>
  
  <!-- 左外 -->
  <path d="M 150 380 C 175 390 170 415 155 425 C 135 415 130 390 150 380 Z" fill="#ffffff"/>
  
  <!-- 右外 -->
  <path d="M 350 380 C 325 390 330 415 345 425 C 365 415 370 390 350 380 Z" fill="#ffffff"/>
</svg>